<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Schedule report</title>
<style>
/* Visual language of the in-tool analysis report, with system font stacks so the
   file opens identically on a machine with no network and behind a proxy that
   blocks external fonts. Every colour is a token; both themes are complete. */
:root{
  --ground:#EDEFEE; --surface:#FFFFFF; --surface-2:#F5F7F6;
  --line:#D4D9D7; --line-soft:#E5E9E7;
  --ink:#111618; --ink-2:#3E4A4E; --ink-3:#68767B;
  --accent:#1B4D8F; --accent-soft:#E7EEF7; --stripe:#D8A409;
  --crit:#A32015; --crit-bg:#FBEAE7; --warn:#8A5300; --warn-bg:#FAF1E0;
  --good:#166B50; --good-bg:#E5F2EC; --mark-soft:#9BA6AA;
  --c1:#2C6BB5; --c2:#0E9384;
  --shadow:0 1px 2px rgba(17,22,24,.05),0 10px 28px -20px rgba(17,22,24,.35);
  --display:-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --sans:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#0D1113; --surface:#161B1E; --surface-2:#1D2427;
  --line:#2E3639; --line-soft:#232B2E;
  --ink:#E7ECEE; --ink-2:#B3BEC2; --ink-3:#839499;
  --accent:#7BADE8; --accent-soft:#16283C;
  --crit:#F0897C; --crit-bg:#2D1512; --warn:#E0A64A; --warn-bg:#2A2011;
  --good:#6DC7A4; --good-bg:#112A21; --mark-soft:#6C7A7F;
  --c1:#6FA3E0; --c2:#4FB8A8;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px rgba(0,0,0,.9);
}}
:root[data-theme="dark"]{
  --ground:#0D1113; --surface:#161B1E; --surface-2:#1D2427;
  --line:#2E3639; --line-soft:#232B2E;
  --ink:#E7ECEE; --ink-2:#B3BEC2; --ink-3:#839499;
  --accent:#7BADE8; --accent-soft:#16283C;
  --crit:#F0897C; --crit-bg:#2D1512; --warn:#E0A64A; --warn-bg:#2A2011;
  --good:#6DC7A4; --good-bg:#112A21; --mark-soft:#6C7A7F;
  --c1:#6FA3E0; --c2:#4FB8A8;
  --shadow:0 1px 2px rgba(0,0,0,.45),0 10px 28px -20px rgba(0,0,0,.9);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:15px/1.55 var(--sans)}
.wrap{max-width:1120px;margin:0 auto;padding-block:28px 60px;padding-left:22px;padding-right:22px}
a{color:var(--accent)}
h1{font:700 30px/1.15 var(--display);letter-spacing:-.018em;margin:14px 0 18px;text-wrap:balance}
h2{font:600 21px/1.2 var(--display);letter-spacing:-.012em;margin:0}
h3{font:700 19px/1.25 var(--display);letter-spacing:-.012em;margin:0;flex:1 1 300px}
p{margin:0 0 10px}
.eyebrow{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.mono{font-family:var(--mono)}
/* capa */
.capa{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 26px 24px;box-shadow:var(--shadow)}
.striping{height:6px;background:repeating-linear-gradient(90deg,var(--stripe) 0 18px,transparent 18px 26px);opacity:.85;margin:-22px -26px 18px;border-radius:4px 4px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:500 11.5px/1 var(--mono);letter-spacing:.04em;padding:6px 9px;border-radius:2px;border:1px solid var(--line);color:var(--ink-2);background:var(--surface-2)}
.chip.forte{background:var(--accent-soft);border-color:transparent;color:var(--accent);font-weight:600}
.ficha{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:3px;overflow:hidden;margin:0}
.ficha>div{background:var(--surface);padding:11px 13px}
.ficha dt{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.ficha dd{margin:0;font:600 15px/1.2 var(--sans);font-variant-numeric:tabular-nums;word-break:break-word}
/* veredito */
.veredito{display:grid;grid-template-columns:minmax(220px,1fr) 2fr;gap:18px;margin:18px 0;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:22px 26px;box-shadow:var(--shadow)}
@media(max-width:720px){.veredito{grid-template-columns:1fr}}
.hero-num{font:700 56px/1 var(--display);letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;margin:8px 0 6px}
.hero-cap{font-size:13px;color:var(--ink-3)}
.contra h2{font-size:17px;margin-bottom:8px}
.contra p{color:var(--ink-2);font-size:14.5px;max-width:66ch}
.contra p:last-child{margin:0}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0}
button{font:500 13px var(--sans);padding:7px 12px;border:1px solid var(--line);border-radius:3px;background:var(--surface);color:var(--ink);cursor:pointer}
button:hover{border-color:var(--accent);color:var(--accent)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:9px;margin:18px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:11px 13px;border-top:3px solid var(--line)}
.tile.cr{border-top-color:var(--crit)} .tile.al{border-top-color:var(--warn)}
.tile.vf{border-top-color:var(--mark-soft)} .tile.pd{border-top-color:var(--accent)}
.tile .c{font:600 12px var(--mono);color:var(--ink-3)}
.tile .v{font:700 30px/1.1 var(--display);letter-spacing:-.02em;margin:2px 0;font-variant-numeric:tabular-nums}
.tile .v.zero{color:var(--ink-3);font-weight:500}
.tile .t{font-size:12.5px;color:var(--ink-2)}
/* sections */
section{margin-top:34px}
.sec-h{display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.sec-d{color:var(--ink-2);font-size:14.5px;max-width:70ch;margin:0 0 12px}
/* índice */
nav.indice{background:var(--surface);border:1px solid var(--line);border-radius:4px;overflow:hidden}
nav.indice a{display:grid;grid-template-columns:56px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:11px 16px;border-bottom:1px solid var(--line-soft);text-decoration:none;color:var(--ink)}
nav.indice a:last-child{border-bottom:none}
nav.indice a:hover{background:var(--surface-2)}
nav.indice .cod{font:600 12px var(--mono);color:var(--ink-3)}
nav.indice .tt{font-size:14.5px;font-weight:500}
nav.indice .tt small{display:block;font-weight:400;color:var(--ink-3);font-size:12.5px}
nav.indice .qtd{font:600 13px var(--mono);color:var(--ink-2);min-width:34px;text-align:right}
.sev{font:600 10.5px/1 var(--mono);letter-spacing:.07em;text-transform:uppercase;padding:3px 7px;border-radius:2px;white-space:nowrap}
.sev.cr{background:var(--crit-bg);color:var(--crit)} .sev.al{background:var(--warn-bg);color:var(--warn)}
.sev.vf{background:var(--surface-2);color:var(--ink-3);border:1px solid var(--line-soft)}
.sev.pd{background:var(--accent-soft);color:var(--accent)} .sev.vs{background:var(--good-bg);color:var(--good)}
/* achado */
.achado{background:var(--surface);border:1px solid var(--line);border-radius:4px;margin-top:18px;box-shadow:var(--shadow);overflow:hidden}
.achado>.barra{height:3px;background:var(--line)}
.achado.cr>.barra{background:var(--crit)} .achado.al>.barra{background:var(--warn)}
.achado.vf>.barra{background:var(--mark-soft)} .achado.pd>.barra{background:var(--accent)}
.achado-in{padding:22px 26px 24px;display:flex;flex-direction:column;gap:16px}
@media(max-width:640px){.achado-in{padding:16px}}
.achado-top{display:flex;gap:11px;align-items:baseline;flex-wrap:wrap}
.achado-top .cod{font:600 12.5px var(--mono);color:var(--ink-3)}
.badge{font:700 26px/1 var(--display);font-variant-numeric:tabular-nums}
.achado.cr .badge{color:var(--crit)} .achado.al .badge{color:var(--warn)}
.achado.vf .badge{color:var(--ink-3)} .achado.pd .badge{color:var(--accent)}
.sub{color:var(--ink-3);font-size:14px;margin:-8px 0 0}
.qa{display:grid;gap:12px}
.qa .bloco{display:grid;grid-template-columns:100px minmax(0,1fr);gap:15px;align-items:start}
@media(max-width:640px){.qa .bloco{grid-template-columns:1fr;gap:3px}}
.qa .rot{font:500 10.5px/1.5 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-top:4px}
.qa .txt{color:var(--ink-2);font-size:14.8px;max-width:72ch}
.levar{background:var(--surface-2);border:1px solid var(--line-soft);border-radius:3px;padding:13px 16px}
.levar .rot{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-bottom:6px}
.levar p{margin:0;font-size:14px;color:var(--ink-2)}
.fonte{font-size:12.5px;color:var(--ink-3)}
.fonte b{color:var(--ink-2);font-weight:600}
.note{background:var(--warn-bg);border:1px solid var(--warn);border-left-width:4px;border-radius:3px;padding:10px 14px;font-size:14px}
.note.bad{background:var(--crit-bg);border-color:var(--crit)}
.note.good{background:var(--good-bg);border-color:var(--good)}
.note.soft{background:var(--surface-2);border-color:var(--line)}
.leitura{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:3px;padding:12px 16px;margin:10px 0 14px}
.leitura .rot{font:500 10.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.leitura p{margin:0 0 6px;font-size:14.5px;color:var(--ink)} .leitura p:last-child{margin:0}
.sintese{background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:20px 24px;margin:18px 0;box-shadow:var(--shadow)}
.sintese .eyebrow{margin-bottom:8px} .sintese p{font-size:15.5px;max-width:72ch;color:var(--ink)}
.sintese .who{font-size:12.5px;color:var(--ink-3);margin-top:8px}
/* tables, collapsed by default */
details{border:1px solid var(--line-soft);border-radius:3px;background:var(--surface-2)}
summary{cursor:pointer;padding:9px 13px;font:500 13.5px var(--sans);color:var(--accent);list-style:none;display:flex;gap:8px;align-items:center}
summary::-webkit-details-marker{display:none}
summary::before{content:"";width:0;height:0;border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent;transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
@media(prefers-reduced-motion:reduce){summary::before{transition:none}}
.scroll{overflow-x:auto;border-top:1px solid var(--line-soft);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line-soft);white-space:nowrap;vertical-align:top}
th{font:500 10.5px/1.2 var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);background:var(--surface-2);position:sticky;top:0}
tbody tr:nth-child(even){background:var(--surface-2)}
tr:last-child td{border-bottom:0}
td.num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
td.name{white-space:normal;min-width:220px}
td.neg{color:var(--crit)} td.pos{color:var(--good)}
/* charts */
.chart{margin:8px 0 4px}
.chart .row{display:grid;grid-template-columns:minmax(90px,200px) 1fr auto;gap:10px;align-items:center;padding:3px 0;font-size:13px}
.chart .rot{color:var(--ink-2);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.track{background:var(--line-soft);border-radius:2px;height:14px;position:relative;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:2px}
.fill.c1{background:var(--c1)} .fill.c2{background:var(--c2)} .fill.warn{background:var(--warn)} .fill.good{background:var(--good)}
.val{font:500 12px var(--mono);color:var(--ink-3);min-width:56px;text-align:right;font-variant-numeric:tabular-nums}
.dual .track{height:9px;margin:2px 0}
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:12.5px;color:var(--ink-3);margin:8px 0 4px}
.legend span{display:flex;gap:6px;align-items:center}
.sw{width:11px;height:11px;border-radius:2px;display:inline-block}
.conv{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:1px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:3px;overflow:hidden}
.conv>div{background:var(--surface);padding:10px 12px}
.conv dt{font:500 10.5px/1 var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);margin-bottom:5px}
.conv dd{margin:0;font-size:13.5px;color:var(--ink-2)}
footer{margin-top:44px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-3);max-width:80ch}
@media print{
  :root{--ground:#fff;--surface:#fff;--surface-2:#f4f4f4;--ink:#000;--ink-2:#222;--ink-3:#444;--line:#bbb;--line-soft:#ddd;--shadow:none}
  .bar{display:none} body{font-size:10.5pt} .wrap{max-width:none;padding-block:0}
  details{border:none} details>summary{display:none} details:not([open])>*{display:block}
  .scroll{overflow:visible} table{font-size:8pt} td,th{white-space:normal} th{position:static}
  .achado,.veredito,.capa{box-shadow:none;break-inside:avoid} section{break-before:auto}
  .fill,.tile,.sev{print-color-adjust:exact;-webkit-print-color-adjust:exact}
}
</style></head>
<body><div class="wrap" id="app">Rendering…</div>
<script>
const DATA = /*DATA*/ null;

// The template holds no prose of its own: every word a person reads arrives in
// DATA.labels, chosen for the schedule's own language.
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const loc = () => (DATA&&DATA.lang==="pt")?"pt-BR":"en-US";
const n = (v,d=0) => v==null?"&mdash;":(typeof v==="number"?v.toLocaleString(loc(),{minimumFractionDigits:d,maximumFractionDigits:d}):esc(v));
const fill = (s,vals) => String(s==null?"":s).replace(/\{(\w+)\}/g,(_,k)=>vals[k]==null?"":vals[k]);
const SEV = {critical:"cr",high:"al",check:"vf",pending:"pd",view:"vs"};
let L = {};

function theme(t){
  if(!t) return;
  const r=document.documentElement.style;
  if(t.accent) r.setProperty("--accent",t.accent);
  if(t.crit) r.setProperty("--crit",t.crit);
  if(t.warn) r.setProperty("--warn",t.warn);
  if(t.good) r.setProperty("--good",t.good);
  if(t.font_display) r.setProperty("--display",t.font_display);
  if(t.font_sans) r.setProperty("--sans",t.font_sans);
  if(t.font_mono) r.setProperty("--mono",t.font_mono);
}
function reading(key){
  const r=(DATA.readings||{})[key];
  if(!r||!r.length) return "";
  return `<div class="leitura"><div class="rot">${esc(L.reading)}</div>${r.map(s=>`<p>${esc(s)}</p>`).join("")}</div>`;
}
function bar(){
  return `<div class="bar"><button id="pdf">${esc(L.print)}</button><button id="th">${esc(L.toggle_theme)}</button></div>`;
}
function ficha(pairs){
  return `<dl class="ficha">${pairs.filter(([,v])=>v!=null&&v!=="").map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${v}</dd></div>`).join("")}</dl>`;
}
function chart(series,{cls="",fmt=v=>n(v)}={}){
  if(!series||!series.length) return `<p class="sub">${esc(L.no_data)}</p>`;
  const max=Math.max(...series.map(s=>Math.abs(s.value)))||1;
  return `<div class="chart">${series.map(s=>`<div class="row">
    <div class="rot" title="${esc(s.label)}">${esc(s.label)}</div>
    <div class="track"><div class="fill ${cls}" style="width:${Math.abs(s.value)/max*100}%"></div></div>
    <div class="val">${fmt(s.value)}</div></div>`).join("")}</div>`;
}
function dualChart(rows){
  return `<div class="chart dual">${rows.map(r=>`<div class="row">
    <div class="rot" title="${esc(r.label)}">${esc(r.label)}</div>
    <div><div class="track"><div class="fill c1" style="width:${Math.min(100,r.planned_pct)}%"></div></div>
         <div class="track"><div class="fill c2" style="width:${Math.min(100,r.earned_pct)}%"></div></div></div>
    <div class="val">${n(r.weight_pct,1)}%</div></div>`).join("")}</div>
  <div class="legend"><span><i class="sw" style="background:var(--c1)"></i>${esc(L.legend_planned)}</span>
  <span><i class="sw" style="background:var(--c2)"></i>${esc(L.legend_actual)}</span>
  <span>${esc(L.legend_budget)}</span></div>`;
}
function scurveSvg(periods,altLabel){
  // Cumulative planned, earned and the other method, as percent of BAC, over the
  // months the file phases. Inline SVG: no library, theme tokens for every colour.
  if(!periods.length) return "";
  const W=920,H=300,pl=44,pr=16,pt=14,pb=34;
  const xs=i=>pl+(W-pl-pr)*(periods.length===1?0:i/(periods.length-1));
  const ys=v=>pt+(H-pt-pb)*(1-Math.max(0,Math.min(100,v))/100);
  const line=(key,cls)=>{
    const pts=periods.map((p,i)=>p[key]==null?null:`${xs(i).toFixed(1)},${ys(p[key]).toFixed(1)}`).filter(Boolean);
    return pts.length?`<polyline class="${cls}" points="${pts.join(" ")}"/>`:"";
  };
  const grid=[0,25,50,75,100].map(v=>`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${ys(v)}" y2="${ys(v)}"/><text class="ax" x="${pl-6}" y="${ys(v)+4}" text-anchor="end">${v}%</text>`).join("");
  const step=Math.max(1,Math.ceil(periods.length/12));
  const xlab=periods.map((p,i)=>i%step?"":`<text class="ax" x="${xs(i)}" y="${H-pb+18}" text-anchor="middle">${esc(p.period)}</text>`).join("");
  const last=periods.map((p,i)=>p.earned_cum_pct==null?-1:i).filter(i=>i>=0).pop();
  const marker=last!=null?`<circle class="dot" cx="${xs(last)}" cy="${ys(periods[last].earned_cum_pct)}" r="4"/>`:"";
  return `<div class="scroll" style="border:none"><svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px;display:block" role="img">
    <style>
      .grid{stroke:var(--line-soft);stroke-width:1}
      .ax{font:11px var(--mono);fill:var(--ink-3)}
      .pl{fill:none;stroke:var(--c1);stroke-width:2.2}
      .ea{fill:none;stroke:var(--c2);stroke-width:2.6}
      .al{fill:none;stroke:var(--warn);stroke-width:1.6;stroke-dasharray:5 4}
      .dot{fill:var(--c2)}
    </style>
    ${grid}${line("planned_cum_pct","pl")}${line("earned_alt_cum_pct","al")}${line("earned_cum_pct","ea")}${marker}${xlab}
  </svg></div>
  <div class="legend"><span><i class="sw" style="background:var(--c1)"></i>${esc(L.scurve_planned)}</span>
  <span><i class="sw" style="background:var(--c2)"></i>${esc(L.scurve_earned)}</span>
  <span><i class="sw" style="background:var(--warn)"></i>${esc(altLabel)}</span></div>`;
}
function cell(v,key){
  if(v==null||v==="") return `<td></td>`;
  if(typeof v==="number"){
    const neg = (key==="var_d"||key==="gap_days") && v<0, pos=(key==="var_d")&&v>0;
    const d = Number.isInteger(v)?0:1;
    const s = key==="var_d"&&v>0?"+"+n(v,d):n(v,d);
    return `<td class="num${neg?" pos":""}${pos?" neg":""}">${s}</td>`;
  }
  return `<td class="${key==="name"?"name":""}">${esc(v)}</td>`;
}
function table(cols,rows,limit=600){
  if(!rows||!rows.length) return "";
  const head=cols.map(c=>`<th>${esc(c.label)}</th>`).join("");
  const body=rows.slice(0,limit).map(r=>"<tr>"+cols.map(c=>cell(r[c.key],c.key)).join("")+"</tr>").join("");
  const more=rows.length>limit?`<p class="sub" style="padding:8px 12px">${esc(fill(L.showing,{n:limit,total:rows.length}))}</p>`:"";
  return `<div class="scroll"><table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>${more}`;
}
function folded(cols,rows,count){
  if(!rows||!rows.length) return `<p class="sub">${esc(L.no_activities)}</p>`;
  return `<details><summary>${esc(fill(L.show_rows,{n:n(count!=null?count:rows.length)}))}</summary>${table(cols,rows)}</details>`;
}

function renderReview(d){
  const m=d.meta, c=d.conventions, out=[];
  const net=d.findings.filter(f=>f.code==="A1"||f.code==="A2").reduce((a,f)=>a+f.count,0);

    if(RG.length){
      const rv={"on pace":L.rg_on_pace,"stretch":L.rg_stretch,"out of reach":L.rg_out};
      out.push(`<h3 style="font-size:16px;margin:18px 0 8px">${esc(L.rg_title)}</h3><p class="sec-d">${esc(L.rg_sub)}</p>
        ${table([{label:L.col_group,key:"group"},{label:L.col_weight_pct,key:"_w"},{label:L.col_earned_pct_cum,key:"earned_pct"},{label:L.col_planned_pct,key:"planned_pct"},
          {label:L.col_practised,key:"practised_pct_per_week"},{label:L.col_required,key:"required_pct_per_week"},{label:L.col_fin_baseline,key:"baseline_finish"},
          {label:L.col_weeks_left,key:"weeks_left"},{label:L.col_ratio,key:"ratio_required_over_practised"},{label:L.col_verdict,key:"_v"}],
          RG.map(r=>({...r,_w:d.scurve&&d.scurve.bac?Math.round(r.bac/d.scurve.bac*10000)/100:null,_v:rv[r.verdict]||""})))}`);
    }
    if(MB.milestones&&MB.milestones.length){
      out.push(`<h3 style="font-size:16px;margin:18px 0 8px">${esc(L.mb_title)}</h3><p class="sec-d">${esc(fill(L.mb_sub,{a:n(MB.p50_days),b:n(MB.p80_days),n:n(MB.sample)}))}</p>
        ${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_fin_baseline,key:"baseline_finish"},{label:L.col_fin_trend,key:"finish"},{label:L.col_slip_now,key:"slip_now_days"},{label:L.col_p50,key:"p50"},{label:L.col_p80,key:"p80"},{label:L.col_deadline,key:"deadline"},{label:L.col_critical,key:"critical"}],MB.milestones,MB.milestones.length)}`);
    }
    if(RX.available){
      out.push(`<h3 style="font-size:16px;margin:18px 0 8px">${esc(L.rx_title)}</h3><p class="sec-d">${esc(fill(L.rx_sub,{rule:RX.reserve_rule}))}</p>
        <div class="tiles"><div class="tile al"><div class="c">${esc(L.rx_now)}</div><div class="v">${n(RX.share_in_reserve_pct,1)}%</div><div class="t">${n(RX.in_reserve,0)} / ${n(RX.remaining_total,0)}</div></div>
        <div class="tile cr"><div class="c">${esc(L.rx_shift)}</div><div class="v">${n(RX.share_if_slips_30_days_pct,1)}%</div><div class="t"></div></div></div>
        ${chart((RX.months||[]).map(x=>({label:x.period,value:x.share_in_reserve})),{cls:"warn",fmt:v=>n(v,1)+"%"})}
        <p class="fonte">${esc(RX.basis)}</p>`);
    }
    out.push(`</section>`);
  }

  if(d.forensics){
    const X=d.forensics, S=X.summary||{}, EX=X.execution||{}, SL=EX.start_slippage||{}, CY=X.cycle;
    out.push(`<section id="v9"><div class="sec-h"><span class="eyebrow">V9</span><h2>${esc(L.fx_title)}</h2></div><p class="sec-d">${esc(L.fx_sub)}</p>${reading("forensics")}`);
    out.push(`<h3 style="font-size:16px;margin:10px 0 8px">${esc(L.fx_paths_title)}</h3><p class="sec-d">${esc(fill(L.fx_paths_sub,{n:5}))}</p>`);
    if(S.origins&&S.origins.length){
      out.push(`<p class="fonte" style="margin-bottom:6px"><b>${esc(L.fx_origins)}</b></p>${table([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_milestones_n,key:"milestones"}],S.origins)}`);
    }
    const ms=(X.milestones||[]).map(m=>({...m,origin_id:m.origin?m.origin.id:null,origin_name:m.origin?m.origin.name:null,origin_var:m.origin?m.origin.variance_days:null,
      amp_id:m.amplifier?m.amplifier.id:null,amp_added:m.amplifier?m.amplifier.added_days:null,
      open_end_t:m.open_end?"●":"",reaches_t:m.reaches_started?"●":""}));
    out.push(`<div style="margin-top:10px">${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_fin_baseline,key:"baseline_finish"},{label:L.col_fin_trend,key:"finish"},{label:L.col_var_days,key:"variance_days"},
      {label:L.col_origin,key:"origin_id"},{label:L.col_activity,key:"origin_name"},{label:L.col_origin_var,key:"origin_var"},{label:L.col_amplifier,key:"amp_id"},{label:L.col_added,key:"amp_added"},{label:L.col_chain,key:"chain_length"},{label:L.col_reaches,key:"reaches_t"},{label:L.col_open_end,key:"open_end_t"}],ms,ms.length)}</div>`);
    (X.milestones||[]).slice(0,12).forEach(m=>{
      out.push(`<details style="margin-top:6px"><summary>${esc(L.fx_chain_show)} · ${esc(m.id)} ${esc(m.name)} · ${esc(L.col_var_days)} ${n(m.variance_days)}</summary>
        ${table([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_via,key:"via"},{label:L.col_fin_baseline,key:"baseline_finish"},{label:L.col_fin_trend,key:"finish"},{label:L.col_var_days,key:"variance_days"},{label:L.col_started,key:"started_t"}],
          m.chain.map(c=>({...c,started_t:c.finished?"✓✓":(c.started?"✓":"")})))}</details>`);
    });
    if(X.calendars&&X.calendars.length){
      out.push(`<h3 style="font-size:16px;margin:18px 0 8px">${esc(L.fx_cal_title)}</h3><p class="sec-d">${esc(L.fx_cal_sub)}</p>`);
      X.calendars.forEach(c=>{
        out.push(`<details${c.flags.length?" open":""}><summary>${esc(c.name)}${c.flags.length?` · ${esc(c.flags.join("; "))}`:""}</summary>
          ${table([{label:L.col_year,key:"year"},{label:L.col_activity_days,key:"activity_days"},{label:L.col_reserve_days,key:"reserve_days"}],c.years)}</details>`);
      });
    }
    out.push(`<h3 style="font-size:16px;margin:18px 0 8px">${esc(L.fx_exec_title)}</h3><p class="sec-d">${esc(fill(L.fx_exec_sub,{n:n(SL.sample),p50:n(SL.p50),p80:n(SL.p80),early:n(SL.started_early),late:n(SL.started_late)}))}</p>
      ${table([{label:L.col_period,key:"period"},{label:L.col_pairs,key:"pairs"},{label:L.col_ignored,key:"ignored"}],EX.out_of_sequence_by_month||[])}`);
    if(CY){
      out.push(`<h3 style="font-size:16px;margin:18px 0 8px">${esc(L.fx_cycle_title)}</h3><p class="sec-d">${esc(L.fx_cycle_sub)}</p>
        ${table([{label:L.col_group,key:"group"},{label:L.col_activities,key:"activities"},{label:L.col_consumed,key:"float_consumed_days"}],CY.float_by_group||[])}
        <p class="fonte" style="margin:10px 0 6px"><b>${esc(L.fx_became_critical)}</b> ${n((CY.became_critical||[]).length)}</p>
        ${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_group,key:"group"},{label:L.col_float_before,key:"float_before"}],CY.became_critical||[])}
        <div style="margin-top:10px">${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_finish_before,key:"finish_before"},{label:L.col_finish_now,key:"finish_now"},{label:L.col_moved,key:"moved_days"},{label:L.col_attribution,key:"attribution"}],CY.milestone_movements||[])}</div>`);
    }
    out.push(`<p class="fonte" style="margin-top:10px">${esc(X.provenance||"")}</p></section>`);
  }

  out.push(`<section><div class="sec-h"><span class="eyebrow">${esc(L.findings)}</span><h2>${esc(L.findings)}</h2></div>
    <p class="sec-d">${L.counting_convention} ${esc(c.network_counting)} ${esc(L.counting_tail)} ${esc(m.links_evaluated||"")}</p>`);
  d.findings.forEach(f=>{
    let extra="";
    if(f.as_successors!=null) extra=" "+fill(L.counted_three,{d:n(f.count),s:n(f.as_successors),p:n(f.as_predecessors)});
    out.push(`<div class="achado ${SEV[f.severity]}" id="f-${f.code}"><div class="barra"></div><div class="achado-in">
      <div class="achado-top"><span class="cod">${f.code}</span><h3>${esc(f.title)}</h3><span class="sev ${SEV[f.severity]}">${esc(f.severity_word)}</span><span class="badge">${n(f.count)}</span></div>
      <p class="sub">${esc(f.subtitle)}</p>
      ${f.code==="G"?`<div class="note soft">${L.g_note}</div>`:""}
      ${f.code==="P"&&f.count?`<div class="note soft">${L.p_note}</div>`:""}
      ${f.code==="A1"&&m.ignored_pairs?`<div class="note soft">${esc(fill(L.ignored_pairs,{n:n(m.ignored_pairs)}))}</div>`:""}
      <div class="qa">
        <div class="bloco"><div class="rot">${esc(L.problem)}</div><div class="txt">${esc(f.problem)}</div></div>
        <div class="bloco"><div class="rot">${esc(L.impact)}</div><div class="txt">${esc(f.impact)}</div></div>
        <div class="bloco"><div class="rot">${esc(L.solution)}</div><div class="txt">${esc(f.solution)}</div></div>
      </div>
      <div class="levar"><div class="rot">${esc(L.levar)}</div><p>${esc(f.criterion)}${esc(extra)} ${esc(f.reproduce)}</p></div>
      <div class="fonte"><b>${esc(L.fonte)}</b> ${esc(f.source)}</div>
      ${folded(f.columns,f.items,f.count)}
    </div></div>`);
  });
  out.push(`</section>`);

  const lg=d.language||{}, rc=m.reconciliation||{};
  out.push(`<section><div class="sec-h"><h2>${esc(L.conventions_title)}</h2></div><dl class="conv">
    ${[[L.conv_slot,c.baseline_slot],[L.conv_chosen,c.baseline_slot_basis],[L.conv_threshold,c.threshold_days+" "+c.threshold_unit],[L.conv_tolerance,c.tolerance_text],[L.conv_population,c.population],[L.conv_counting,c.network_counting],[L.conv_working,c.working_days],[L.conv_percent,c.percent_source],[L.conv_language,`${d.lang} (${lg.confidence||""})`],[L.conv_lang_basis,lg.basis],
      [L.conv_reconciliation||"Earned value vs file",rc.leaves_compared?`${n(rc.matches_to_cent)} / ${n(rc.leaves_compared)} · ${n(rc.difference,2)} · ${n(rc.ahead_of_baseline)}`:null]]
      .filter(([,v])=>v!=null&&v!=="").map(([k,v])=>`<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join("")}</dl></section>`);
  return out.join("");
}

function renderCycle(d){
  const m=d.meta, out=[];
  out.push(`<header class="capa"><div class="striping"></div>
    <div class="chips"><span class="chip forte">${esc(L.cycle_title)}</span><span class="chip">${esc(L.generated)} ${esc(m.generated)}</span></div>
    <h1>${esc(m.previous_source||"")} &rarr; ${esc(m.current_source||"")}</h1>
    ${ficha([[L.prev_status,esc(m.previous_status_date)],[L.curr_status,esc(m.current_status_date)],[L.baseline_slot,esc(m.current_baseline_slot)],[L.budget,n(m.current_budget_at_completion,2)]])}${bar()}</header>`);
  out.push(`<div class="veredito"><div><div class="eyebrow">${esc(L.card_movement)}</div><div class="hero-num">${n(m.movement_points,2)}</div><div class="hero-cap">${esc(L.pp_headline)}</div></div>
    <div class="contra"><h2>${esc(L.how_to_read)}</h2><p>${L.cycle_read_p1}</p><p>${L.cycle_read_p2}</p></div></div>`);
  out.push(`<div class="tiles">
    <div class="tile"><div class="c">${esc(L.card_previous)}</div><div class="v">${n(m.previous_percent_earned,2)}%</div><div class="t">${esc(L.weighted_progress)}</div></div>
    <div class="tile"><div class="c">${esc(L.card_current)}</div><div class="v">${n(m.current_percent_earned,2)}%</div><div class="t">${esc(L.weighted_progress)}</div></div>
    <div class="tile pd"><div class="c">${esc(L.card_explained)}</div><div class="v">${n(m.explained_points,3)}</div><div class="t">${esc(L.by_progress)}</div></div>
    <div class="tile cr"><div class="c">${esc(L.card_residue)}</div><div class="v">${n(m.unexplained_points,3)}</div><div class="t">${esc(L.not_work)}</div></div></div>`);
  (d.warnings||[]).forEach(w=>out.push(`<div class="note"><b>${esc(L.warning)}</b> ${esc(w)}</div>`));
  const r=d.readings;
  out.push(`<section><div class="sec-h"><h2>${esc(L.exec_or_plan)}</h2></div><p class="sec-d">${esc(L.exec_or_plan_sub)}</p><div class="tiles">
    <div class="tile pd"><div class="c">${esc(L.card_execution)}</div><div class="v">${n(r.execution.length)}</div><div class="t">${esc(L.exec_sub)}</div></div>
    <div class="tile al"><div class="c">${esc(L.card_replan)}</div><div class="v">${n(r.replan.length)}</div><div class="t">${esc(L.replan_sub)}</div></div>
    <div class="tile cr"><div class="c">${esc(L.card_reference)}</div><div class="v">${n(r.reference.length)}</div><div class="t">${esc(L.reference_sub)}</div></div></div></section>`);
  if(r.reference.length){
    out.push(`<section><div class="sec-h"><h2>${esc(L.baseline_moved_title)}</h2></div><p class="sec-d">${esc(L.baseline_moved_sub)}</p>
      ${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_bl_start,key:"baseline_start_moved_days"},{label:L.col_bl_finish,key:"baseline_finish_moved_days"}],r.reference)}</section>`);
  }
  out.push(`<section><div class="sec-h"><h2>${esc(L.movement_from)}</h2></div><p class="sec-d">${esc(fill(L.movement_from_sub,{denom:d.conventions.denominator}))}</p>
    ${chart(d.decomposition.slice(0,25).map(x=>({label:`${x.id} ${x.name}`,value:x.contribution_points})),{fmt:v=>n(v,3)+" pp"})}
    ${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_wbs,key:"wbs"},{label:L.col_pct_prev,key:"percent_previous"},{label:L.col_pct_curr,key:"percent_current"},{label:L.col_bl_cost,key:"baseline_cost"},{label:L.col_contribution,key:"contribution_points"}],d.decomposition)}</section>`);
  out.push(`<section><div class="sec-h"><h2>${esc(L.dates_moved)}</h2></div>
    ${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"},{label:L.col_matched,key:"matched_by"},{label:L.col_start_moved,key:"start_moved_days"},{label:L.col_finish_moved,key:"finish_moved_days"},{label:L.col_reading,key:"reading"}],r.execution.concat(r.replan))}</section>`);
  out.push(`<section><div class="sec-h"><h2>${esc(L.scope_changes)}</h2></div><p class="sec-d">${esc(L.scope_sub)}</p>
    <h3 style="font-size:15px;margin:8px 0">${esc(L.inserted)} (${n(d.unmatched.inserted.length)})</h3>${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"}],d.unmatched.inserted)}
    <h3 style="font-size:15px;margin:12px 0 8px">${esc(L.removed)} (${n(d.unmatched.removed.length)})</h3>${folded([{label:L.col_row,key:"id"},{label:L.col_activity,key:"name"}],d.unmatched.removed)}</section>`);
  return out.join("");
}

(function(){
  const app=document.getElementById("app");
  if(!DATA){app.innerHTML="<h1>No data</h1><p>This template was opened directly. It is filled in when a report is generated.</p>";return;}
  L=DATA.labels||{};
  theme(DATA.theme);
  if(DATA.lang) document.documentElement.setAttribute("lang",DATA.lang);
  app.innerHTML=(DATA.kind==="cycle"?renderCycle(DATA):renderReview(DATA))+`<footer>${L.footer||""}</footer>`;
  ((DATA.profile||{}).sections_hidden||[]).forEach(id=>{
    const s=document.getElementById(id); if(s) s.remove();
    document.querySelectorAll(`nav.indice a[href="#${id}"]`).forEach(a=>a.remove());
  });
  const pdf=document.getElementById("pdf"), th=document.getElementById("th");
  if(pdf) pdf.onclick=()=>{document.querySelectorAll("details").forEach(x=>x.open=true);window.print();};
  if(th) th.onclick=()=>{
    const root=document.documentElement;
    const dark=getComputedStyle(root).getPropertyValue("--ground").trim().startsWith("#0D");
    root.setAttribute("data-theme",dark?"light":"dark");
  };
})();
</script></body></html>
